name: Refresh live pixel art

# Hourly: the banner sky follows the time in Jakarta and the quest panel follows the latest push.
# Published to the `live` branch so main's history stays clean.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Draw banner and quest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh api "users/${{ github.repository_owner }}/repos?sort=pushed&per_page=10" > repos.json
          python3 -I scripts/pixel_art.py live repos.json dist

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: live
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
